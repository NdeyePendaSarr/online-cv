      </ul>

  <main id="contenu">
    <h1 class="contact page-title">Contactez-moi</h1>
    <div class="form">
      <img src="images/logo-nps.jpg" alt="Logo NPS">
      <form action="https://formspree.io/f/mjkvpavo" method="post">
        <p>
          <label for="firstname">Prénom <span class="required" aria-hidden="true">*</span></label>
          <input type="text" name="firstname" id="firstname" placeholder="Votre prénom" required class="stylePlaceholder" autocomplete="given-name">
          <label for="lastname">Nom <span class="required" aria-hidden="true">*</span></label>
          <input type="text" name="lastname" id="lastname" placeholder="Votre nom" required class="stylePlaceholder" autocomplete="family-name">
        </p>
        <p>
          <label for="email">Email <span class="required" aria-hidden="true">*</span></label>
          <input type="email" name="email" id="email" placeholder="votre@email.com" required class="stylePlaceholder" autocomplete="email">
          <span class="field-hint">Vérifiez votre adresse email, je vous répondrai dès que possible.</span>
          <label for="num">Téléphone <span class="optional">(optionnel)</span></label>
          <input type="tel" name="num" id="num" placeholder="+221 7X XXX XX XX" pattern="^(\+221|00221)?[76][0-9]{8}$" title="Format sénégalais : +221 7X XXX XX XX ou 00221 7X XXX XX XX" class="stylePlaceholder" autocomplete="tel">
        </p>
        <label for="comment">Message <span class="required" aria-hidden="true">*</span></label>
        <textarea name="commentaire" id="comment" maxlength="700" required placeholder="Tapez votre message ici…" class="textarea-placeholder"></textarea>
        <p>
          <input type="submit" id="envoyer" name="envoyer" value="Soumettre">
          <input type="reset" id="suprimer" name="suprimer" value="Annuler">
        </p>
      </form>
    </div>
  </main>
